function initAwale(stage, ctx) {
  let b = Array(12).fill(4), turn = 0, busy = false, idle = 0;
  const score = [0, 0];
  const side = p => [0, 1, 2, 3, 4, 5].map(k => p * 6 + k);
  const own = (p, i) => i >= p * 6 && i < p * 6 + 6;
  const sum = (B, p) => side(p).reduce((a, j) => a + B[j], 0);
  const nm = p => ctx.isCpu(p) ? "L'ordi" : ctx.names[p];

  function sow(B, pit) {
    const B2 = B.slice(); let s = B2[pit], i = pit; const path = [];
    B2[pit] = 0;
    while (s > 0) { i = (i + 1) % 12; if (i === pit) continue; B2[i]++; s--; path.push(i); }
    return { B2, path, last: i };
  }
  function simulate(B, pit, p) {
    const { B2, path, last } = sow(B, pit), o = 1 - p;
    let caps = [];
    if (own(o, last)) {
      let j = last;
      while (own(o, j) && (B2[j] === 2 || B2[j] === 3)) { caps.push(j); j--; }
      const taken = caps.reduce((a, k) => a + B2[k], 0);
      if (taken && sum(B2, o) - taken === 0) caps = []; // grand chelem : on ne prend rien
    }
    const B3 = B2.slice(); let got = 0;
    caps.forEach(k => { got += B3[k]; B3[k] = 0; });
    return { B: B3, path, caps, got };
  }
  function legal(B, p) {
    const o = 1 - p;
    let mv = side(p).filter(j => B[j] > 0);
    if (sum(B, o) === 0) mv = mv.filter(j => sum(sow(B, j).B2, o) > 0);
    return mv;
  }

  /* ----- Plateau ----- */
  const wrap = el('div', 'aw');
  const store = p => el('div', 'aw-store p' + p, `<span class="dot"></span><span class="aw-who">Grenier de ${esc(nm(p))}</span><span class="aw-n">0<small>graines</small></span>`);
  const st1 = store(1), st0 = store(0);
  const boardEl = el('div', 'aw-board');
  const rowTop = el('div', 'aw-row top'), rowBot = el('div', 'aw-row bot');
  const pits = [];
  for (let i = 0; i < 12; i++) {
    const p = el('button', 'aw-pit', '<span class="aw-in"></span><b class="aw-c"></b>');
    p.dataset.i = i; pits[i] = p;
    p.addEventListener('click', () => tap(i));
  }
  for (let i = 11; i >= 6; i--) rowTop.append(pits[i]);
  for (let i = 0; i < 6; i++) rowBot.append(pits[i]);
  boardEl.append(rowTop, rowBot);
  wrap.append(st1, boardEl, st0, el('p', 'aw-help', 'Les graines tournent dans le sens contraire des aiguilles d’une montre : vers la droite en bas, vers la gauche en haut.'));
  stage.append(wrap);

  const SEED_C = ['var(--seed1)', 'var(--seed2)', 'var(--seed3)'];
  function drawPit(i, n) {
    const inn = pits[i].firstChild, vis = Math.min(n, 18);
    let h = '';
    for (let k = 0; k < vis; k++) {
      const rr = 11.5 * Math.sqrt(k + (k ? .4 : 0)), a = k * 2.39996 + i;
      const x = 50 + rr * Math.cos(a) - 9.5, y = 50 + rr * Math.sin(a) - 9.5;
      h += `<span class="seed" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;--sc:${SEED_C[(k * 7 + i) % 3]}"></span>`;
    }
    inn.innerHTML = h;
    pits[i].lastChild.textContent = n;
    pits[i].setAttribute('aria-label', `Trou ${own(0, i) ? i + 1 : i - 5} de ${nm(own(0, i) ? 0 : 1)} : ${plural(n, 'graine', 'graines')}`);
  }
  function drawAll(B) { for (let i = 0; i < 12; i++) drawPit(i, B[i]); }
  function drawScores(bump) {
    [[st0, 0], [st1, 1]].forEach(([s, p]) => {
      const n = $('.aw-n', s); n.innerHTML = `${score[p]}<small>${score[p] > 1 ? 'graines' : 'graine'}</small>`;
      if (bump === p) { n.classList.remove('bump'); void n.offsetWidth; n.classList.add('bump'); }
      s.classList.toggle('on', turn === p);
    });
    ctx.score(score, 'graine', 'graines');
  }
  function markPlayable() {
    const mv = (!busy && !ctx.isCpu(turn)) ? legal(b, turn) : [];
    pits.forEach((p, i) => { p.classList.toggle('can', mv.includes(i)); p.classList.remove('hl', 'from', 'cap'); });
  }

  function tap(i) {
    if (busy || ctx.isCpu(turn)) return;
    if (!own(turn, i)) { ctx.sound('bad'); ctx.msg(ctx.cpu ? 'Joue dans ta rangée, celle du bas.' : `Joue dans ta rangée, <b>${esc(nm(turn))}</b>.`); return; }
    if (!legal(b, turn).includes(i)) {
      ctx.sound('bad');
      ctx.msg(b[i] === 0 ? 'Ce trou est vide.' : `<b>${esc(nm(1 - turn))}</b> n’a plus rien : choisis un trou qui lui donne des graines.`);
      return;
    }
    move(i);
  }

  async function move(pit) {
    busy = true; markPlayable();
    const p = turn, res = simulate(b, pit, p);
    const work = b.slice(); work[pit] = 0; drawPit(pit, 0); pits[pit].classList.add('from');
    ctx.sound('tick');
    let prev = -1;
    for (const i of res.path) {
      await ctx.wait(reduceMotion ? 30 : 150);
      work[i]++; drawPit(i, work[i]);
      if (prev >= 0) pits[prev].classList.remove('hl');
      pits[i].classList.add('hl'); prev = i;
      ctx.sound('tick');
    }
    await ctx.wait(250);
    if (prev >= 0) pits[prev].classList.remove('hl');
    pits[pit].classList.remove('from');
    if (res.caps.length) {
      res.caps.forEach(k => pits[k].classList.add('cap'));
      ctx.sound('pop');
      await ctx.wait(550);
    }
    b = res.B; score[p] += res.got; drawAll(b);
    pits.forEach(x => x.classList.remove('cap'));
    drawScores(res.got ? p : -1);
    if (res.got) { idle = 0; ctx.toast(`${ctx.isYou(p) ? 'Tu ramasses' : nm(p) + ' ramasse'} ${plural(res.got, 'graine', 'graines')}`); }
    else idle++;
    if (score[p] > 24) { await ctx.wait(600); ctx.end(p, `${score[p]} graines contre ${score[1 - p]}`); return; }
    if (idle >= 60) { finish('Plus aucune prise depuis longtemps : chacun garde les graines de son camp.'); return; }
    turn = 1 - turn; busy = false;
    next();
  }

  function finish(note) {
    busy = true;
    score[0] += sum(b, 0); score[1] += sum(b, 1);
    b = Array(12).fill(0); drawAll(b); drawScores(-1);
    const w = score[0] === score[1] ? -1 : (score[0] > score[1] ? 0 : 1);
    ctx.msg(note);
    ctx.wait(1400).then(() => ctx.end(w, `${score[0]} graines contre ${score[1]}`));
  }

  function next() {
    ctx.turn(turn); drawScores(-1);
    if (!legal(b, turn).length) { finish(`${nm(turn)} ne peut plus jouer : chacun garde les graines de son camp.`); return; }
    if (ctx.isCpu(turn)) {
      busy = true; markPlayable(); ctx.msg("L'ordi compte ses graines…");
      ctx.wait(700).then(() => move(cpuPick()));
    } else {
      markPlayable();
      const feed = sum(b, 1 - turn) === 0 ? ` Donne des graines à ${esc(nm(1 - turn))} !` : '';
      ctx.msg((ctx.cpu ? 'À toi : touche un trou de ta rangée (en bas).' : `À <b>${esc(nm(turn))}</b> : rangée du ${turn === 0 ? 'bas' : 'haut'}.`) + feed);
    }
  }

  /* ----- Ordi : negamax sur la différence de graines ----- */
  function search(B, depth, p, alpha, beta) {
    const mv = legal(B, p);
    if (!mv.length) return sum(B, p) - sum(B, 1 - p);
    if (depth === 0) return 0;
    let best = -1e9;
    for (const m of mv) {
      const r = simulate(B, m, p);
      const v = r.got - search(r.B, depth - 1, 1 - p, r.got - beta, r.got - alpha);
      if (v > best) best = v;
      if (best > alpha) alpha = best;
      if (alpha >= beta) break;
    }
    return best;
  }
  function cpuPick() {
    const mv = legal(b, 1); let best = [], bs = -1e9;
    mv.forEach(m => {
      const r = simulate(b, m, 1);
      const v = (score[1] + r.got > 24) ? 1e6 : r.got - search(r.B, 5, 0, -1e9, 1e9);
      if (v > bs) { bs = v; best = [m]; } else if (v === bs) best.push(m);
    });
    return best[rnd(best.length)];
  }

  drawAll(b); next();
}

function initHockey(stage, ctx) {
  const GOALS = 7, GL = .3, GR = .7, MAXS = 3.4, AI_SPEED = 1.45;
  const wrap = el('div', 'hk'); const cv = el('canvas', 'hk-cv'); wrap.append(cv); stage.append(wrap);
  const g = cv.getContext('2d');
  let W = 300, A = 1.6, dpr = 1, col = {};
  const puck = { x: .5, y: .8, vx: 0, vy: 0, r: .045 };
  const pads = [{ x: .5, y: 1.4, vx: 0, vy: 0, tx: .5, ty: 1.4, r: .085, pid: null }, { x: .5, y: .2, vx: 0, vy: 0, tx: .5, ty: .2, r: .085, pid: null }];
  const score = [0, 0];
  let pauseUntil = performance.now() + 1100, banner = 'Prêts ?', bannerP = -1, over = false, last = performance.now(), lastHit = 0, raf = 0, slow = 0;

  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    ['--ice', '--ice-line', '--p1', '--p1-edge', '--p1-soft', '--p2', '--p2-edge', '--p2-soft', '--ink', '--surface', '--muted'].forEach(v => { col[v] = cs.getPropertyValue(v).trim(); });
  }
  function size() {
    const r = stage.getBoundingClientRect();
    let w = r.width, h = r.height - 12;
    if (h / w > 1.75) h = w * 1.75;
    if (h / w < 1.3) w = h / 1.3;
    w = Math.max(200, w); h = Math.max(260, h);
    W = w; A = h / w;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    clampPads();
  }
  function clampPads() {
    pads.forEach((p, i) => {
      p.x = clamp(p.x, p.r, 1 - p.r);
      p.y = i === 0 ? clamp(p.y, A / 2 + p.r, A - p.r) : clamp(p.y, p.r, A / 2 - p.r);
    });
    puck.y = clamp(puck.y, puck.r, A - puck.r);
  }
  function resetPuck(towards) {
    puck.x = .5; puck.vx = 0; puck.vy = 0;
    puck.y = towards === 0 ? A / 2 + .2 : towards === 1 ? A / 2 - .2 : A / 2;
  }
  function resetPads() {
    pads[0].x = pads[0].tx = .5; pads[0].y = pads[0].ty = A - .2;
    pads[1].x = pads[1].tx = .5; pads[1].y = pads[1].ty = .2;
  }

  /* ----- Doigts ----- */
  const toUnit = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.width]; };
  function setTarget(p, x, y) { pads[p].tx = x; pads[p].ty = y + (p === 0 ? -.07 : .07); }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    const [x, y] = toUnit(e);
    let p = y > A / 2 ? 0 : 1;
    if (ctx.cpu) p = 0;
    const pad = pads[p];
    if (pad.pid !== null && pad.pid !== e.pointerId) return;
    pad.pid = e.pointerId;
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* rien */ }
    setTarget(p, x, y);
  });

    pads.forEach((pad, p) => { if (pad.pid === e.pointerId) { const [x, y] = toUnit(e); setTarget(p, x, y); } });
  });
  const release = e => pads.forEach(pad => { if (pad.pid === e.pointerId) pad.pid = null; });
  cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);
  ctx.on(window, 'resize', size);
  let mq = null;
  try { mq = matchMedia('(prefers-color-scheme: dark)'); ctx.on(mq, 'change', readColors); } catch (e) { /* rien */ }
  const mo = new MutationObserver(readColors); mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); ctx.cleanups.push(() => mo.disconnect());

  /* ----- Ordi ----- */
  function aiTarget() {
    const me = pads[1];
    if (puck.y < A / 2 + .04) {
      if (puck.y > me.y + .01) {
        const dx = puck.x - .5, dy = puck.y - (A + .1), d = Math.hypot(dx, dy) || 1;
        return [puck.x + dx / d * .03, puck.y + dy / d * .03];
      }
      return [puck.x + (puck.x > .5 ? -.14 : .14), puck.y - .14];
    }
    return [.5 + (puck.x - .5) * .5, .13];
  }

  /* ----- Physique ----- */
  function goal(scorer) {
    score[scorer]++;
    ctx.score(score, 'but', 'buts');
    ctx.sound(ctx.isCpu(scorer) ? 'bad' : 'win');
    banner = 'But !'; bannerP = scorer;
    if (score[scorer] >= GOALS) {
      over = true; pauseUntil = Infinity;
      ctx.wait(1300).then(() => ctx.end(scorer, `${score[scorer]} buts à ${score[1 - scorer]}`));
    } else {
      pauseUntil = performance.now() + 1200;
      resetPuck(1 - scorer);
    }
  }
  function step(dt) {
    const sub = 4, h = dt / sub;
    const ai = ctx.cpu ? aiTarget() : null;
    for (let k = 0; k < sub; k++) {
      pads.forEach((pad, p) => {
        let tx = pad.tx, ty = pad.ty;

        const max = (ai && p === 1 ? AI_SPEED : 14) * h;

        pad.vx = dx / h; pad.vy = dy / h; pad.x += dx; pad.y += dy;
      });
      puck.x += puck.vx * h; puck.y += puck.vy * h;
      const pr = puck.r;
      if (puck.x < pr) { puck.x = pr; puck.vx = Math.abs(puck.vx) * .9; }
      if (puck.x > 1 - pr) { puck.x = 1 - pr; puck.vx = -Math.abs(puck.vx) * .9; }
      const mouth = puck.x > GL + pr * .4 && puck.x < GR - pr * .4;
      if (!mouth) {
        if (puck.y < pr) { puck.y = pr; puck.vy = Math.abs(puck.vy) * .9; }
        if (puck.y > A - pr) { puck.y = A - pr; puck.vy = -Math.abs(puck.vy) * .9; }
      } else {
        if (puck.y < -pr) { goal(0); return; }
        if (puck.y > A + pr) { goal(1); return; }
      }
      pads.forEach(pad => {
        const dx = puck.x - pad.x, dy = puck.y - pad.y, d = Math.hypot(dx, dy), min = pr + pad.r;
        if (d < min && d > 1e-6) {
          const nx = dx / d, ny = dy / d;
          puck.x = pad.x + nx * min; puck.y = pad.y + ny * min;
          const vn = (puck.vx - pad.vx) * nx + (puck.vy - pad.vy) * ny;
          if (vn < 0) {
            puck.vx -= 1.85 * vn * nx; puck.vy -= 1.85 * vn * ny;
            const t = performance.now();
            if (t - lastHit > 90) { ctx.sound('puck'); lastHit = t; }
          }
        }
      });
      const sp = Math.hypot(puck.vx, puck.vy);
      if (sp > MAXS) { puck.vx *= MAXS / sp; puck.vy *= MAXS / sp; }
    }
    const f = Math.pow(.72, dt);
    puck.vx *= f; puck.vy *= f;

    if (Math.hypot(puck.vx, puck.vy) < .04) { slow += dt; if (slow > 3) { slow = 0; resetPuck(puck.y > A / 2 ? 0 : 1); } } else slow = 0;
  }

  /* ----- Dessin ----- */
  function circle(x, y, r, fill) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fillStyle = fill; g.fill(); }
  function draw(t) {
    const s = W, H = A * W;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, s, H);
    // table
    g.fillStyle = col['--ice']; g.beginPath(); g.roundRect ? g.roundRect(0, 0, s, H, 26) : g.rect(0, 0, s, H); g.fill();
    // zones de but
    g.fillStyle = col['--p2-soft']; g.beginPath(); g.arc(s / 2, 0, s * .22, 0, Math.PI); g.fill();
    g.fillStyle = col['--p1-soft']; g.beginPath(); g.arc(s / 2, H, s * .22, Math.PI, Math.PI * 2); g.fill();
    // lignes
    g.lineWidth = 3; g.strokeStyle = col['--ice-line'];
    g.beginPath(); g.arc(s / 2, H / 2, s * .14, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.moveTo(0, H / 2); g.lineTo(s, H / 2); g.stroke();
    g.beginPath(); g.moveTo(0, H * .25); g.lineTo(s, H * .25); g.moveTo(0, H * .75); g.lineTo(s, H * .75); g.globalAlpha = .5; g.stroke(); g.globalAlpha = 1;
    // buts
    g.fillStyle = col['--ink'];
    g.fillRect(s * GL, 0, s * (GR - GL), 6); g.fillRect(s * GL, H - 6, s * (GR - GL), 6);
    // score
    g.font = `900 ${Math.round(s * .16)}px ui-rounded, "SF Pro Rounded", system-ui, sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.globalAlpha = .22;
    g.fillStyle = col['--p1']; g.fillText(score[0], s * .14, H / 2 + s * .12);
    g.save(); g.translate(s * .14, H / 2 - s * .12); if (!ctx.cpu) g.rotate(Math.PI); g.fillStyle = col['--p2']; g.fillText(score[1], 0, 0); g.restore();
    g.globalAlpha = 1;
    // palet
    circle(puck.x * s + 2, puck.y * s + 3, puck.r * s, 'rgba(0,0,0,.12)');
    circle(puck.x * s, puck.y * s, puck.r * s, col['--ink']);
    circle(puck.x * s, puck.y * s, puck.r * s * .55, col['--muted']);
    // maillets
    pads.forEach((p, i) => {
      const c = i === 0 ? '--p1' : '--p2', e = i === 0 ? '--p1-edge' : '--p2-edge';
      circle(p.x * s + 2, p.y * s + 4, p.r * s, 'rgba(0,0,0,.14)');
      circle(p.x * s, p.y * s, p.r * s, col[c]);
      circle(p.x * s, p.y * s, p.r * s * .62, col[e]);
      circle(p.x * s, p.y * s, p.r * s * .4, col[c]);
      circle(p.x * s - p.r * s * .12, p.y * s - p.r * s * .14, p.r * s * .12, 'rgba(255,255,255,.45)');
    });
    // bandeau
    if (t < pauseUntil || over) {
      g.font = `900 ${Math.round(s * .13)}px ui-rounded, "SF Pro Rounded", system-ui, sans-serif`;
      g.fillStyle = bannerP === 0 ? col['--p1'] : bannerP === 1 ? col['--p2'] : col['--ink'];
      const flip = !ctx.cpu && bannerP === 1;
      g.save(); g.translate(s / 2, H / 2); if (flip) g.rotate(Math.PI);
      g.fillStyle = col['--surface']; const tw = g.measureText(banner).width + s * .12;
      g.beginPath(); g.roundRect ? g.roundRect(-tw / 2, -s * .1, tw, s * .2, s * .1) : g.rect(-tw / 2, -s * .1, tw, s * .2); g.fill();
      g.fillStyle = bannerP === 0 ? col['--p1'] : bannerP === 1 ? col['--p2'] : col['--ink'];
      g.fillText(banner, 0, s * .005); g.restore();
    }
  }
  function frame(t) {
    if (!ctx.alive) return;
    const dt = Math.min(.033, (t - last) / 1000); last = t;
    if (!over && t >= pauseUntil) step(dt);
    draw(t);
    raf = requestAnimationFrame(frame);
  }

  readColors(); size(); resetPads(); resetPuck(-1);
  ctx.score(score, 'but', 'buts'); ctx.turn(2);
  ctx.msg(ctx.cpu ? 'Glisse ton doigt en bas pour bouger ton maillet. Premier à 7 buts.' : 'Téléphone à plat entre vous. Chacun glisse son doigt dans sa moitié.');
  // un deuxième calage une fois la mise en page posée
  requestAnimationFrame(() => { if (ctx.alive) { size(); resetPads(); } });
  raf = requestAnimationFrame(frame);
  return () => cancelAnimationFrame(raf);
}

boot();
</script>
